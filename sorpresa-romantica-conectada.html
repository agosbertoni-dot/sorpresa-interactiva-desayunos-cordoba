<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Correo Especial - Tu Sorpresa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital@0;1&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --rose-quartz: #F9CBD6;
    --blush: #F2AFBC;
    --red-wine: #9E182B;
    --oat-milk: #F2E0D2;
    --ink: #3a2420;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: 'Playfair Display', Georgia, serif;
    background: var(--red-wine);
  }
  .stage-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 18px;
  }
  .stage {
    position: relative;
    width: 100%;
    max-width: 420px;
    height: 90vh;
    height: 90dvh;
    max-height: 800px;
    background: var(--oat-milk);
    border-radius: 26px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
  }
  /* decorative floating hearts background */
  .heart-field { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  .heart-field span {
    position: absolute;
    color: var(--blush);
    opacity: 0.35;
    font-size: 14px;
  }
  .screen {
    position: absolute;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px 26px;
    opacity: 0;
    transform: translateX(24px);
    pointer-events: none;
    transition: opacity 0.55s ease, transform 0.55s ease;
  }
  .screen.active { opacity: 1; transform: translateX(0); pointer-events: auto; }
  .screen.leaving { opacity: 0; transform: translateX(-24px); }

  .tap-zone { position: absolute; top: 0; bottom: 0; width: 45%; z-index: 20; }
  .tap-zone.left { left: 0; } .tap-zone.right { right: 0; }

  /* ---- Loading / error ---- */
  #screen-loading, #screen-error {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center; padding: 40px;
    z-index: 30; background: var(--oat-milk);
  }
  #screen-error { display: none; }
  .spinner {
    width: 40px; height: 40px; border-radius: 50%;
    border: 3px solid var(--blush); border-top-color: var(--red-wine);
    animation: spin 0.9s linear infinite; margin-bottom: 18px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- Greeting ---- */
  .label-pill {
    background: var(--blush);
    color: var(--red-wine);
    padding: 9px 24px;
    border-radius: 30px;
    font-size: 17px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    font-style: normal;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .sub-label {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: 15px;
    color: var(--red-wine);
    opacity: 0.75;
    margin-bottom: 22px;
  }
  .greeting-line { font-size: 30px; color: var(--ink); margin-bottom: 4px; }
  .greeting-name {
    font-family: 'Dancing Script', cursive;
    font-size: 52px;
    color: var(--red-wine);
    line-height: 1.1;
    margin-bottom: 18px;
  }
  .greeting-sub { font-size: 16px; color: var(--ink); opacity: 0.75; margin-bottom: 30px; max-width: 280px; }

  .heart-btn {
    width: 78px; height: 78px; border-radius: 50%;
    background: var(--red-wine);
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 30px;
    box-shadow: 0 8px 18px rgba(158,24,43,0.45);
    cursor: pointer;
    transition: transform 0.15s ease;
    position: relative;
    z-index: 6;
  }
  .heart-btn:active { transform: scale(0.92); }
  .tap-hint {
    margin-top: 18px; font-size: 12.5px; letter-spacing: 1.5px;
    color: var(--red-wine); opacity: 0.6; font-style: italic;
  }
  .flying-heart {
    position: absolute; font-size: 20px; color: var(--red-wine);
    pointer-events: none; animation: floatUp 1.1s ease-out forwards; z-index: 7;
  }
  @keyframes floatUp {
    0% { opacity: 1; transform: translateY(0) scale(0.8); }
    100% { opacity: 0; transform: translateY(-90px) scale(1.3); }
  }

  /* ---- Calendar ---- */
  .cal-label { font-style: italic; font-size: 13px; letter-spacing: 1.5px; color: var(--red-wine); margin-bottom: 18px; }
  .cal-card {
    background: #fff; border: 1.5px solid var(--red-wine); border-radius: 4px;
    padding: 26px 22px 20px; width: 100%; max-width: 300px; position: relative;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1); transform: rotate(-1deg);
  }
  .cal-month { text-align: center; font-style: italic; font-size: 22px; color: var(--red-wine); }
  .cal-year { text-align: center; font-size: 12px; opacity: 0.55; margin-bottom: 16px; }
  .cal-weekdays, .cal-days { display: grid; grid-template-columns: repeat(7,1fr); }
  .cal-weekdays span { text-align: center; font-size: 10.5px; opacity: 0.5; font-style: italic; }
  .cal-days span { text-align: center; font-size: 13px; padding: 5px 0; position: relative; opacity: 0.8; }
  .cal-days span.marked { font-weight: bold; color: var(--red-wine); }
  .cal-days span.marked svg { position: absolute; inset: -6px; width: calc(100% + 12px); height: calc(100% + 12px); overflow: visible; }
  .cal-caption { text-align: center; font-style: italic; font-size: 15px; color: var(--red-wine); margin-top: 22px; }
  .heart-path {
    fill: none; stroke: var(--red-wine); stroke-width: 2.2;
    stroke-linecap: round; stroke-dasharray: 120; stroke-dashoffset: 120;
    animation: drawHeart 3.2s ease-in-out infinite;
  }
  @keyframes drawHeart {
    0% { stroke-dashoffset: 120; }
    55% { stroke-dashoffset: 0; }
    80% { stroke-dashoffset: 0; opacity: 1; }
    92% { opacity: 0; }
    100% { stroke-dashoffset: 120; opacity: 1; }
  }

  /* ---- Photos ---- */
  .photo-frame {
    width: 100%; max-width: 280px; aspect-ratio: 4/5;
    background: var(--oat-milk); padding: 46px 12px 14px;
    box-shadow: 0 10px 26px rgba(0,0,0,0.18); transform: rotate(-1.5deg);
    display: flex; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .photo-frame .photo-bg {
    position: absolute; inset: 46px 12px 14px; object-fit: cover;
    filter: blur(18px) brightness(0.9); opacity: 0.55; z-index: 1;
  }
  .photo-frame img.photo-main { position: relative; z-index: 2; width: 100%; height: 100%; object-fit: contain; display: block; }
  .photo-caption { position: absolute; top: 10px; left: 0; right: 0; text-align: center; font-size: 19px; font-weight: 600; font-style: italic; color: var(--red-wine); z-index: 2; padding: 0 10px; }
  .photo-dots { display: flex; gap: 7px; margin-top: 22px; }
  .photo-dots span { width: 6px; height: 6px; border-radius: 50%; background: var(--red-wine); opacity: 0.25; }
  .photo-dots span.on { opacity: 0.9; }

  /* ---- Envelope / phrase ---- */
  .envelope {
    width: 220px; height: 150px; position: relative; cursor: pointer;
    filter: drop-shadow(0 10px 20px rgba(0,0,0,0.2));
  }
  .envelope::before {
    content: ''; position: absolute; inset: -50px; z-index: -1;
    background: radial-gradient(circle, rgba(242,175,188,0.55) 0%, rgba(242,175,188,0) 70%);
  }
  .env-body { position: absolute; inset: 0; background: var(--blush); border: 2px solid var(--red-wine); border-radius: 4px; }
  .env-flap {
    position: absolute; top: 0; left: 0; right: 0; height: 78px;
    background: var(--rose-quartz); border: 2px solid var(--red-wine); border-top: none;
    clip-path: polygon(0 0, 50% 62%, 100% 0);
    transform-origin: top center; transition: transform 0.5s ease;
    z-index: 2;
  }
  .envelope.open .env-flap { transform: rotateX(180deg); }
  .env-ribbon-v { position: absolute; left: 50%; top: 0; bottom: 0; width: 12px; margin-left: -6px; background: var(--red-wine); z-index: 1; opacity: 0.9; transition: opacity 0.4s ease; }
  .env-ribbon-h { position: absolute; top: 50%; left: 0; right: 0; height: 12px; margin-top: -6px; background: var(--red-wine); z-index: 1; opacity: 0.9; transition: opacity 0.4s ease; }
  .envelope.open .env-ribbon-v, .envelope.open .env-ribbon-h { opacity: 0; }
  .env-seal {
    position: absolute; top: 46%; left: 50%; transform: translate(-50%,-50%);
    width: 34px; height: 34px; border-radius: 50%; background: var(--red-wine);
    color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px;
    transition: opacity 0.3s ease; z-index: 3; box-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .envelope.open .env-seal { opacity: 0; }
  .env-hint { margin-top: 20px; font-style: italic; font-size: 13px; color: var(--red-wine); opacity: 0.6; }
  .phrase-card { position: relative; display: none; max-width: 300px; width: 100%; margin-top: 10px; }
  .phrase-card.show { display: block; animation: slideUpIn 0.6s ease; }
  @keyframes slideUpIn { from { opacity:0; transform: translateY(20px); } to { opacity:1; transform: translateY(0); } }
  .postcard-frame {
    padding: 8px; border-radius: 14px;
    background: repeating-linear-gradient(-45deg,
      var(--red-wine) 0px, var(--red-wine) 9px,
      #fff 9px, #fff 18px,
      var(--blush) 18px, var(--blush) 27px,
      #fff 27px, #fff 36px);
    box-shadow: 0 14px 30px rgba(0,0,0,0.22);
  }
  .postcard-inner { position: relative; background: var(--oat-milk); border-radius: 8px; padding: 32px 24px 26px; }
  .postcard-stamp {
    position: absolute; top: 10px; right: 12px; width: 44px; height: 54px;
    background: var(--blush); border: 2px dashed var(--red-wine);
    display: flex; align-items: center; justify-content: center;
    color: var(--red-wine); font-size: 20px; transform: rotate(7deg);
  }
  .phrase-text { font-size: 18px; font-style: italic; text-align: center; color: var(--red-wine); line-height: 1.6; }

  .envelope.hiding, #phrase-label.hiding, #envelope-hint.hiding {
    opacity: 0; transform: scale(0.8) translateY(-10px); pointer-events: none;
    transition: opacity 0.45s ease, transform 0.45s ease;
  }
  .envelope-deco { position: absolute; inset: 0; pointer-events: none; z-index: 4; }
  .envelope-deco span { position: absolute; color: var(--blush); opacity: 0.6; }

  /* ---- Final ---- */
  .final-photo {
    width: 100%; max-width: 260px; aspect-ratio: 4/5; object-fit: cover;
    border: 6px solid #fff; box-shadow: 0 12px 28px rgba(0,0,0,0.25);
    margin-bottom: 22px; transform: rotate(1deg); background: var(--blush);
  }
  .signature { font-family: 'Dancing Script', cursive; font-size: 30px; color: var(--red-wine); text-align: center; line-height: 1.3; }
  .signature .lead { font-family: 'Playfair Display', serif; font-size: 15px; font-style: italic; color: var(--ink); display:block; margin-bottom:2px; }
  .heart-seal { width: 42px; height: 42px; border-radius: 50%; background: var(--red-wine); color:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; margin-top:18px; }

  /* ---- BOOM explosion overlay ---- */
  #boom-overlay { position: absolute; inset: 0; z-index: 60; overflow: hidden; pointer-events: none; }
  .boom-heart { position: absolute; animation: boomUp 1.15s ease-out forwards; will-change: transform, opacity; }
  @keyframes boomUp {
    0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    100% { transform: translateY(-900px) scale(1.15) rotate(var(--rot)); opacity: 0; }
  }
  .confetti-piece { position: absolute; top: -24px; border-radius: 1px; animation: confettiFall linear forwards; }
  @keyframes confettiFall {
    0% { transform: translateY(0) rotate(0deg); opacity: 1; }
    100% { transform: translateY(760px) rotate(480deg); opacity: 0; }
  }

  /* ---- ambient hearts on photo screens ---- */
  .ambient-heart { position: absolute; bottom: 8%; color: var(--red-wine); pointer-events: none; z-index: 6; animation: ambientFloat 2.6s ease-out forwards; }
  @keyframes ambientFloat {
    0% { transform: translateY(0); opacity: 0; }
    15% { opacity: 0.65; }
    100% { transform: translateY(-170px); opacity: 0; }
  }
  .brand-logo { width: 90px; margin-top: 22px; opacity: 0.95; }
  .replay-btn {
    margin-top: 20px; background: none; border: 1.5px solid var(--red-wine); color: var(--red-wine);
    padding: 8px 22px; border-radius: 30px; font-family: inherit; font-size: 12px; letter-spacing: 1px; cursor: pointer; opacity: 0.8;
  }
</style>
</head>
<body>

<div class="stage-wrap">
  <div class="stage" id="stage">

    <div class="heart-field" id="heart-field"></div>
    <div id="boom-overlay"></div>

    <!-- Loading -->
    <div id="screen-loading">
      <div class="spinner"></div>
      <p style="color:var(--red-wine); font-style:italic;">Preparando tu sorpresa...</p>
    </div>

    <!-- Error -->
    <div id="screen-error">
      <p style="color:var(--red-wine); font-size:16px; font-style:italic; max-width:260px;" id="error-text"></p>
    </div>

    <!-- Screen 1: Greeting -->
    <div class="screen" id="screen-greeting">
      <div class="label-pill">una carta para vos</div>
      <div class="sub-label">Con todo mi cariño</div>
      <div class="greeting-line">Hola,</div>
      <div class="greeting-name" id="nombre-destinatario">—</div>
      <p class="greeting-sub">Esta sorpresa viene con mucho amor.</p>
      <div class="heart-btn" id="heart-tap-btn">♥</div>
      <div class="tap-hint" id="tap-counter-hint">tocá el corazón para abrir</div>
    </div>

    <!-- Screen 2: Calendar (conditional) -->
    <div class="screen" id="screen-calendar">
      <div class="cal-label">una fecha para recordar</div>
      <div class="cal-card">
        <div class="cal-month" id="cal-month">—</div>
        <div class="cal-year" id="cal-year">—</div>
        <div class="cal-weekdays">
          <span>D</span><span>L</span><span>M</span><span>M</span><span>J</span><span>V</span><span>S</span>
        </div>
        <div class="cal-days" id="cal-days"></div>
      </div>
      <p class="cal-caption" id="cal-caption">—</p>
    </div>

    <!-- Screens 3-5: Photos (generated dynamically) -->
    <div class="screen" id="screen-photo-template" style="display:none;">
      <div class="photo-frame"><img src=""></div>
      <div class="photo-dots"></div>
    </div>
    <div id="photos-container"></div>

    <!-- Screen: Phrase / envelope -->
    <div class="screen" id="screen-phrase">
      <div class="envelope-deco" aria-hidden="true">
        <span style="left:8%; top:6%; font-size:22px;">♥</span>
        <span style="right:10%; top:14%; font-size:16px;">♥</span>
        <span style="left:14%; top:70%; font-size:18px;">♥</span>
        <span style="right:12%; top:66%; font-size:24px;">♥</span>
        <span style="left:6%; top:42%; font-size:13px;">♥</span>
        <span style="right:6%; top:38%; font-size:15px;">♥</span>
      </div>
      <div class="label-pill" id="phrase-label" style="margin-bottom:26px;">un mensaje para vos</div>
      <div class="envelope" id="envelope">
        <div class="env-body"></div>
        <div class="env-ribbon-v"></div>
        <div class="env-ribbon-h"></div>
        <div class="env-flap"></div>
        <div class="env-seal">♥</div>
      </div>
      <p class="env-hint" id="envelope-hint">tocá el sobre para abrirlo</p>
      <div class="phrase-card" id="phrase-card">
        <div class="postcard-frame">
          <div class="postcard-inner">
            <p class="phrase-text" id="frase-dedicatoria">—</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Screen: Final -->
    <div class="screen" id="screen-final">
      <img class="final-photo" id="foto-final" src="" alt="">
      <p class="signature"><span class="lead">Con amor, de</span><span id="nombre-remitente">—</span></p>

<script>
/* ============ CONFIG ============ */
const SHEET_ID = '1czo8_uhzOitaFxwm23WMmlNb085gRfPqDYp7mLDIm_k';
const SHEET_JSON_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`;
const HEART_TAPS_NEEDED = 3;

/* Column indices (0-based) matching the current Sheet layout:
   0 Marca temporal | 1 Código de pedido | 2 Nombre destinatario | 3 Fotos
   4 Frase | 5 Foto final | 6 Remitente | 7 Email | 8 Comprador | 9 Ocasión | 10 Fecha especial */
const COL = { codigo:1, nombre:2, fotos:3, frase:4, fotoFinal:5, remitente:6, ocasion:9, fecha:10 };

/* ============ HELPERS ============ */
function driveDirectLink(raw) {
  if (!raw) return '';
  const m = raw.match(/[-\w]{25,}/);
  return m ? `https://drive.google.com/thumbnail?id=${m[0]}&sz=w1000` : raw;
}

function parseGvizDate(v) {
  if (typeof v === 'string' && v.indexOf('Date(') === 0) {
    const n = v.match(/-?\d+/g).map(Number);
    return new Date(n[0], n[1], n[2]);
  }
  const d = new Date(v);
  return isNaN(d) ? null : d;
}

const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

function showError(msg) {
  document.getElementById('screen-loading').style.display = 'none';
  document.getElementById('error-text').textContent = msg;
  document.getElementById('screen-error').style.display = 'flex';
}

/* ============ SHEET FETCH ============ */
async function loadData() {
  const params = new URLSearchParams(window.location.search);
  const orderId = (params.get('id') || '').trim().toLowerCase();

  if (!orderId) { showError('Falta el código en el link.'); return; }

  try {
    const res = await fetch(SHEET_JSON_URL);
    const text = await res.text();
    const match = text.match(/setResponse\(([\s\S]*)\);?\s*$/);
    if (!match) { showError('No pudimos leer los datos.'); return; }
    const json = JSON.parse(match[1]);
    const rows = json.table.rows || [];

    const found = rows.find(r => {
      const cell = r.c[COL.codigo];
      return cell && cell.v && cell.v.toString().trim().toLowerCase() === orderId;
    });

    if (!found) { showError('No encontramos ese código de pedido. Revisá el link.'); return; }

    const get = (i) => (found.c[i] && found.c[i].v != null) ? found.c[i].v.toString() : '';

    const data = {
      nombre: get(COL.nombre),
      fotos: get(COL.fotos).split(/[,\n]/).map(s => s.trim()).filter(Boolean).map(driveDirectLink),
      frase: get(COL.frase),
      fotoFinal: driveDirectLink(get(COL.fotoFinal)),
      remitente: get(COL.remitente),
      ocasion: get(COL.ocasion),
      fecha: parseGvizDate(found.c[COL.fecha] ? found.c[COL.fecha].v : null)
    };

    buildExperience(data);

  } catch (e) {
    showError('Hubo un problema cargando tu sorpresa. Probá de nuevo en un rato.');
  }
}

/* ============ BUILD PAGE ============ */
let screenOrder = [];
let current = 0;

function buildExperience(data) {
  document.getElementById('nombre-destinatario').textContent = data.nombre || 'vos';
  document.getElementById('nombre-remitente').textContent = data.remitente || '';
  document.getElementById('frase-dedicatoria').textContent = data.frase || '';
  document.getElementById('foto-final').src = data.fotoFinal || '';

  screenOrder = ['screen-greeting'];

  const sinFecha = (data.ocasion || '').toLowerCase().includes('sorprender');
  if (!sinFecha && data.fecha) {
    buildCalendar(data.fecha);
    screenOrder.push('screen-calendar');
  }

  buildPhotos(data.fotos.slice(0, 3));
  data.fotos.slice(0, 3).forEach((_, i) => screenOrder.push('photo-screen-' + i));

  screenOrder.push('screen-phrase');
  screenOrder.push('screen-final');

  document.getElementById('screen-loading').style.display = 'none';
  goToScreen(0);
  setupInteractions();
}

function buildCalendar(fecha) {
  const month = fecha.getMonth();
  const year = fecha.getFullYear();
  const day = fecha.getDate();
  document.getElementById('cal-month').textContent = MESES[month];
  document.getElementById('cal-year').textContent = year;
  document.getElementById('cal-caption').textContent = `${day} de ${MESES[month].toLowerCase()} de ${year} ♥`;

  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const container = document.getElementById('cal-days');
  container.innerHTML = '';

  for (let i = 0; i < firstDow; i++) {
    const empty = document.createElement('span');
    container.appendChild(empty);
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const cell = document.createElement('span');
    cell.textContent = d;
    if (d === day) {
      cell.classList.add('marked');
      cell.innerHTML = d + `<svg viewBox="0 0 40 40"><path class="heart-path" d="M20 32C11 25 4 19 4 12.5 4 7 8 4 12.5 4c3 0 6 2 7.5 5 1.5-3 4.5-5 7.5-5C31.5 4 36 7 36 12.5 36 19 29 25 20 32Z"/></svg>`;
    }
    container.appendChild(cell);
  }
}

const PHOTO_CAPTIONS = ['Un momento inolvidable ♥', '¡Por más recuerdos juntos!', 'Gracias por tu amor ♥'];

function buildPhotos(fotos) {
  const wrapper = document.getElementById('photos-container');
  fotos.forEach((url, i) => {
    const div = document.createElement('div');
    div.className = 'screen';
    div.id = 'photo-screen-' + i;
    div.innerHTML = `
      <div class="photo-frame">
        <img class="photo-bg" src="${url}" alt="">
        <img class="photo-main" src="${url}" alt="Foto ${i+1}">
        <div class="photo-caption">${PHOTO_CAPTIONS[i % PHOTO_CAPTIONS.length]}</div>
      </div>
      <div class="photo-dots">${fotos.map((_, j) => `<span class="${j <= i ? 'on' : ''}"></span>`).join('')}</div>
    `;
    wrapper.appendChild(div);
  });
}

/* ============ NAVIGATION ============ */
let envelopeOpened = false;

function goToScreen(index) {
  if (index < 0 || index >= screenOrder.length) return;
  const currentEl = document.getElementById(screenOrder[current]);
  const nextEl = document.getElementById(screenOrder[index]);
  if (currentEl) {
    currentEl.classList.remove('active');
    currentEl.classList.add('leaving');
    setTimeout(() => currentEl.classList.remove('leaving'), 550);
  }
  if (nextEl) nextEl.classList.add('active');
  current = index;

  if (screenOrder[index] && screenOrder[index].indexOf('photo-screen-') === 0) {
    spawnAmbientHearts(6);
  }
}

function nextScreen() {
  const isFirst = screenOrder[current] === 'screen-greeting';
  const isPhrase = screenOrder[current] === 'screen-phrase';
  const isLast = current === screenOrder.length - 1;
  if (isFirst || isLast) return; // greeting advances only via heart taps
  if (isPhrase && !envelopeOpened) return; // must open envelope first
  goToScreen(current + 1);
}
function prevScreen() {
  const isFirst = screenOrder[current] === 'screen-greeting';
  const isLast = current === screenOrder.length - 1;
  if (isFirst || isLast) return;
  goToScreen(current - 1);
}

/* ============ INTERACTIONS ============ */
function setupInteractions() {
  // Single delegated tap handler on the stage — left half = back, right half = forward.
  // Interactive elements (heart button, envelope, replay) handle their own clicks and
  // are excluded here so they always win, regardless of screen position.
  document.getElementById('stage').addEventListener('click', (e) => {
    if (e.target.closest('.heart-btn, .envelope, .replay-btn')) return;
    const rect = document.getElementById('stage').getBoundingClientRect();
    const x = e.clientX - rect.left;
    if (x < rect.width / 2) prevScreen(); else nextScreen();
  });

  document.getElementById('replay-btn').addEventListener('click', () => {
    envelopeOpened = false;
    const env = document.getElementById('envelope');
    const hint = document.getElementById('envelope-hint');
    const label = document.getElementById('phrase-label');
    const deco = document.querySelector('#screen-phrase .envelope-deco');
    env.classList.remove('open', 'hiding');
    hint.classList.remove('hiding');
    label.classList.remove('hiding');
    env.style.display = '';
    hint.style.display = '';
    label.style.display = '';
    deco.style.display = '';
    document.getElementById('phrase-card').classList.remove('show');
    goToScreen(0);
  });

  // Heart tap counter on greeting
  let taps = 0;
  const heartBtn = document.getElementById('heart-tap-btn');
  const hint = document.getElementById('tap-counter-hint');
  heartBtn.addEventListener('click', () => {
    taps++;
    spawnFlyingHearts(heartBtn);
    heartBtn.style.transform = 'scale(1.12)';
    setTimeout(() => heartBtn.style.transform = 'scale(1)', 150);
    if (taps < HEART_TAPS_NEEDED) {
      hint.textContent = `${HEART_TAPS_NEEDED - taps} toque${HEART_TAPS_NEEDED - taps > 1 ? 's' : ''} más...`;
    } else {
      hint.textContent = 'abriendo tu sorpresa...';
      setTimeout(() => {
        triggerBoom(() => goToScreen(current + 1));
      }, 400);
    }
  });

  // Envelope open interaction
  const envelope = document.getElementById('envelope');
  const phraseCard = document.getElementById('phrase-card');
  const envHint = document.getElementById('envelope-hint');
  envelope.addEventListener('click', (e) => {
    e.stopPropagation();
    if (envelope.classList.contains('open')) return;
    envelope.classList.add('open');
    envelopeOpened = true;
    envHint.classList.add('hiding');
    document.getElementById('phrase-label').classList.add('hiding');
    setTimeout(() => {
      envelope.classList.add('hiding');
    }, 250);
    setTimeout(() => {
      envelope.style.display = 'none';
      envHint.style.display = 'none';
      document.getElementById('phrase-label').style.display = 'none';
      document.querySelector('#screen-phrase .envelope-deco').style.display = 'none';
      phraseCard.classList.add('show');
    }, 700);
  });
}

function triggerBoom(callback) {
  const overlay = document.getElementById('boom-overlay');
  overlay.innerHTML = '';
  const heartColors = ['#9E182B', '#F2AFBC', '#e8c9a0', '#F9CBD6', '#ffffff'];
  const fragment = document.createDocumentFragment();

  for (let i = 0; i < 500; i++) {
    const h = document.createElement('span');
    h.className = 'boom-heart';
    h.textContent = '♥';
    h.style.left = Math.random() * 100 + '%';
    h.style.bottom = (-40 - Math.random() * 400) + 'px';
    h.style.fontSize = (100 + Math.random() * 100) + 'px';
    h.style.color = heartColors[Math.floor(Math.random() * heartColors.length)];
    h.style.setProperty('--rot', (Math.random() * 50 - 25) + 'deg');
    h.style.animationDelay = (Math.random() * 0.6) + 's';
    h.style.animationDuration = (1.2 + Math.random() * 0.5) + 's';
    fragment.appendChild(h);
  }
  overlay.appendChild(fragment);
  setTimeout(() => { overlay.innerHTML = ''; if (callback) callback(); }, 1750);
}

function spawnAmbientHearts(count) {
  const stage = document.getElementById('stage');
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const h = document.createElement('span');
      h.className = 'ambient-heart';
      h.textContent = '♥';
      h.style.left = (10 + Math.random() * 80) + '%';
      h.style.fontSize = (12 + Math.random() * 16) + 'px';
      h.style.opacity = (0.3 + Math.random() * 0.3).toFixed(2);
      stage.appendChild(h);
      setTimeout(() => h.remove(), 2700);
    }, i * 220);
  }
}

function spawnFlyingHearts(originEl) {
  const stage = document.getElementById('stage');
  const rect = originEl.getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();
  for (let i = 0; i < 4; i++) {
    const h = document.createElement('span');
    h.className = 'flying-heart';
    h.textContent = '♥';
    h.style.left = (rect.left - stageRect.left + rect.width/2 - 8 + (Math.random()*40-20)) + 'px';
    h.style.top = (rect.top - stageRect.top) + 'px';
    h.style.animationDelay = (i * 0.08) + 's';
    stage.appendChild(h);
    setTimeout(() => h.remove(), 1300);
  }
}

/* decorative background hearts */
(function scatterHearts() {
  const field = document.getElementById('heart-field');
  for (let i = 0; i < 34; i++) {
    const s = document.createElement('span');
    s.textContent = '♥';
    s.style.left = Math.random()*95 + '%';
    s.style.top = Math.random()*95 + '%';
    s.style.fontSize = (10 + Math.random()*22) + 'px';
    s.style.opacity = (0.18 + Math.random()*0.35).toFixed(2);
    s.style.transform = `rotate(${Math.random()*40-20}deg)`;
    field.appendChild(s);
  }
})();

loadData();
</script>
